<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuandoTeToca · Agenda de extraescolares</title>
  <meta name="description" content="La agenda de las extraescolares de tus hijos: horarios, quién lleva y quién recoge, avisos y gastos. Compártela con tu familia.">
  <link rel="icon" type="image/png" href="img/icon.png">
  <style>
    @font-face { font-family: 'Fraunces'; font-weight: 600; font-display: swap; src: url(fonts/Fraunces_600SemiBold.ttf) format('truetype'); }
    @font-face { font-family: 'Jakarta'; font-weight: 400; font-display: swap; src: url(fonts/PlusJakartaSans_400Regular.ttf) format('truetype'); }
    @font-face { font-family: 'Jakarta'; font-weight: 600; font-display: swap; src: url(fonts/PlusJakartaSans_600SemiBold.ttf) format('truetype'); }
    @font-face { font-family: 'Jakarta'; font-weight: 700; font-display: swap; src: url(fonts/PlusJakartaSans_700Bold.ttf) format('truetype'); }

    :root {
      --bg: #FFF7F2; --surface: #FFFFFF; --ink: #2A1F1A; --ink2: #5E524B; --line: #F0E2D9;
      --coral: #FF7A59; --coral-text: #B8462A; --on-coral: #241B12; --soft: #FFE6DC;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1A1512; --surface: #241E1A; --ink: #F4ECE7; --ink2: #BDB1AA; --line: #3A302A;
              --coral: #FF8A6B; --coral-text: #FF9C80; --on-coral: #241B12; --soft: #3A2620; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: 'Jakarta', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6; }
    a { color: var(--coral-text); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
    h1, h2 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; line-height: 1.15; text-wrap: balance; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; text-decoration: none; color: var(--ink); }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    .brand em { color: var(--coral-text); font-style: italic; }
    .langs button { background: none; border: 1px solid var(--line); color: var(--ink2); font: 600 13px 'Jakarta', sans-serif; padding: 6px 10px; border-radius: 99px; cursor: pointer; }
    .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; padding: 28px 0 48px; }
    .hero h1 { font-size: clamp(34px, 5.2vw, 56px); }
    .hero h1 em { color: var(--coral-text); font-style: italic; }
    .hero p { color: var(--ink2); font-size: 18px; margin: 18px 0 28px; max-width: 36em; }
    .stores { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 16px; padding: 14px 20px; border-radius: 14px; }
    .btn.primary { background: var(--coral); color: var(--on-coral); }
    .btn.ghost { border: 1.5px solid var(--ink); color: var(--ink); }
    .btn svg { width: 20px; height: 20px; }
    .hero-shot { justify-self: center; width: min(320px, 80vw); border-radius: 28px; box-shadow: 0 24px 60px rgba(120, 40, 10, .25); }

    .shots { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 0 24px; }
    .shots img { flex: 0 0 auto; width: 230px; border-radius: 20px; scroll-snap-align: start; box-shadow: 0 10px 30px rgba(120, 40, 10, .15); }

    section { padding: 36px 0; }
    section h2 { font-size: clamp(26px, 3.4vw, 36px); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
    .card b { display: block; font-size: 16px; margin-bottom: 4px; }
    .card span { color: var(--ink2); font-size: 15px; }
    .card.plan b { font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 600; }
    .tag { display: inline-block; background: var(--soft); color: var(--coral-text); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-top: 8px; }
    .note { color: var(--ink2); font-size: 15px; margin-top: 14px; max-width: 46em; }

    footer { border-top: 1px solid var(--line); margin-top: 24px; padding: 28px 0 40px; color: var(--ink2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: space-between; }
    footer nav { display: flex; flex-wrap: wrap; gap: 8px 18px; }

    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; text-align: left; padding-top: 8px; }
      .hero-shot { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="./"><img src="img/icon.png" alt="">Cuando<em>TeToca</em></a>
      <div class="langs" role="group" aria-label="Idioma / Language">
        <button type="button" data-set-lang="es">ES</button>
        <button type="button" data-set-lang="en">EN</button>
      </div>
    </header>

    <div class="hero">
      <div>
        <h1 data-i18n-html="heroTitle"></h1>
        <p data-i18n="heroText"></p>
        <div class="stores">
          <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.devlicius.cuandotetoca">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 2.5v19l10-9.5L4 2.5zm11.4 10.9-2.2 2.1 2.6 2.5 4.3-2.4c.8-.5.8-1.6 0-2.1l-2.6-1.5-2.1 1.4zM5.6 1.6l9.9 9-2.2 2.1L5.6 1.6zm0 20.8 7.7-7.1 2.2 2.1-9.9 5z"/></svg>
            <span>Google Play</span>
          </a>
          <a class="btn ghost" href="https://apps.apple.com/app/id6780570724">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.2 1-4 2.5-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.2.7c1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-.9-2.4-4zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z"/></svg>
            <span>App Store</span>
          </a>
        </div>
      </div>
      <img class="hero-shot" data-shot="hoy" alt="">
    </div>

    <div class="shots">
      <img data-shot="familia" alt="">
      <img data-shot="semana" alt="">
      <img data-shot="gastos" alt="">
      <img data-shot="hoy" alt="">
    </div>

    <section>
      <h2 data-i18n="featuresTitle"></h2>
      <div class="grid" id="features"></div>
    </section>

    <section>
      <h2 data-i18n="plansTitle"></h2>
      <div class="grid" id="plans"></div>
      <p class="note" data-i18n="plansNote"></p>
    </section>

    <section>
      <h2 data-i18n="privacyTitle"></h2>
      <p class="note" data-i18n="privacyText"></p>
    </section>

    <footer>
      <nav>
        <a data-link="privacy" data-i18n="linkPrivacy"></a>
        <a data-link="terms" data-i18n="linkTerms"></a>
        <a data-link="delete" data-i18n="linkDelete"></a>
        <a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a>
      </nav>
      <span>© 2026 Jonatan Ortega González · <span data-i18n="country"></span></span>
    </footer>
  </div>

  <script>
    const T = {
      es: {
        title: 'CuandoTeToca · Agenda de extraescolares',
        heroTitle: 'La agenda de las <em>extraescolares</em> de tus hijos',
        heroText: 'Horarios, quién lleva y quién recoge, avisos y gastos, en un solo sitio. Empiezas sin registrarte y, si quieres, la compartes con tu pareja, los abuelos o quien cuide de los niños.',
        featuresTitle: 'Todo lo que necesitas',
        features: [
          ['Tu día de un vistazo', 'Qué toca hoy, a qué hora y quién lleva y recoge a cada niño. En lista, por semana o por hijo.'],
          ['Recordatorios que llegan', '"Lucía tiene Natación en 15 min", aunque la app esté cerrada. No avisan en vacaciones ni los días sin clase.'],
          ['Cada semana es distinta', '"Solo este día": no hay clase, cambia la hora o quién recoge, sin tocar el resto de semanas.'],
          ['Vacaciones y eventos', 'Festivos para toda la familia o un solo hijo, fechas de curso y eventos sueltos como cumpleaños o médico.'],
          ['Gastos claros', 'Coste mensual, trimestral o anual y matrícula. Total por hijo y de la familia, en PDF o CSV.'],
          ['Comparte en familia', 'Con los planes Pareja y Familia, todos veis la misma agenda y os avisa cuando alguien cambia algo.'],
        ],
        plansTitle: 'Planes',
        plans: [
          ['Gratis', 'La app completa en tu móvil, con anuncios.', ''],
          ['Individual', 'Sin anuncios y copia en la nube para tus otros dispositivos.', ''],
          ['Pareja', 'Lo anterior y compartir la agenda con otra persona.', '7 días de prueba'],
          ['Familia', 'Lo anterior para hasta 5 personas.', ''],
        ],
        plansNote: 'Mensual o anual. Paga solo quien crea la familia; los demás se unen gratis. Se gestiona y cancela desde Google Play o el App Store.',
        privacyTitle: 'Tus datos, bajo tu control',
        privacyText: 'Sin cuenta, todo se guarda solo en tu móvil y funciona sin conexión. Con un plan, los datos de tu familia se guardan en la nube (en la Unión Europea) y solo los ven las personas que invitas. Los datos de tus hijos nunca se usan para publicidad. Puedes borrar tu cuenta y tus datos desde la propia app.',
        linkPrivacy: 'Política de privacidad', linkTerms: 'Términos de uso', linkDelete: 'Eliminar la cuenta',
        country: 'España',
      },
      en: {
        title: "CuandoTeToca · Kids' activity planner",
        heroTitle: "The planner for your kids' <em>after-school activities</em>",
        heroText: 'Times, who drops off and who picks up, reminders and costs, all in one place. Start without signing up and, if you like, share it with your partner, the grandparents or whoever looks after the kids.',
        featuresTitle: 'Everything you need',
        features: [
          ['Your day at a glance', "What's on today, when, and who drops off and picks up each child. As a list, by week or by child."],
          ['Reminders you can count on', '"Emma has Swimming in 15 min", even with the app closed. No reminders on holidays or days without class.'],
          ['Every week is different', '"Only this day": no class, a different time or someone else picking up, without touching the other weeks.'],
          ['Holidays and events', 'Days off for the whole family or one child, course dates and one-off events like birthdays or the doctor.'],
          ['Clear costs', 'Monthly, quarterly or yearly fees plus enrollment. Totals per child and for the family, as PDF or CSV.'],
          ['Share with your family', 'With the Couple and Family plans, everyone sees the same planner and gets notified when someone changes something.'],
        ],
        plansTitle: 'Plans',
        plans: [
          ['Free', 'The full app on your phone, with ads.', ''],
          ['Individual', 'No ads and a cloud copy for your other devices.', ''],
          ['Couple', 'All of the above plus sharing the planner with one other person.', '7-day trial'],
          ['Family', 'All of the above for up to 5 people.', ''],
        ],
        plansNote: 'Monthly or yearly. Only the person who creates the family pays; everyone else joins for free. Manage and cancel it in Google Play or the App Store.',
        privacyTitle: 'Your data, your control',
        privacyText: "Without an account, everything stays on your phone and works offline. With a plan, your family's data is stored in the cloud (in the European Union) and only the people you invite can see it. Your children's data is never used for advertising. You can delete your account and your data from within the app.",
        linkPrivacy: 'Privacy policy', linkTerms: 'Terms of use', linkDelete: 'Delete your account',
        country: 'Spain',
      },
    };
    const BASE = '../';
    function render(lang) {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
      const card = (title, text, tag, plan) => {
        const d = document.createElement('div');
        d.className = 'card' + (plan ? ' plan' : '');
        const b = document.createElement('b'); b.textContent = title;
        const s = document.createElement('span'); s.textContent = text;
        d.append(b, s);
        if (tag) { const g = document.createElement('div'); g.className = 'tag'; g.textContent = tag; d.append(g); }
        return d;
      };
      document.getElementById('features').replaceChildren(...t.features.map(([a, b]) => card(a, b)));
      document.getElementById('plans').replaceChildren(...t.plans.map(([a, b, c]) => card(a, b, c, true)));
      const sfx = lang === 'es' ? '' : '-en';
      const links = { privacy: `cuandotetoca${sfx}.html`, terms: `cuandotetoca-terminos${sfx}.html`, delete: `cuandotetoca-eliminar-cuenta${sfx}.html` };
      document.querySelectorAll('[data-link]').forEach(a => { a.href = BASE + links[a.dataset.link]; });
      document.querySelectorAll('[data-shot]').forEach(img => { img.src = `img/${lang}_${img.dataset.shot}.jpg`; img.alt = t.heroTitle.replace(/<[^>]+>/g, ''); });
      document.querySelectorAll('[data-set-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)));
    }
    const asked = new URLSearchParams(location.search).get('lang');
    const nav = (navigator.language || 'es').slice(0, 2);
    let lang = T[asked] ? asked : (['es', 'ca', 'eu', 'gl'].includes(nav) ? 'es' : 'en');
    document.querySelectorAll('[data-set-lang]').forEach(b => b.addEventListener('click', () => {
      lang = b.dataset.setLang; render(lang);
      history.replaceState(null, '', '?lang=' + lang);
    }));
    render(lang);
  </script>
</body>
</html>
