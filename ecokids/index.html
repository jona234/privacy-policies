    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
    h1, h2 { font-family: 'Fredoka', 'Trebuchet MS', sans-serif; font-weight: 600; line-height: 1.15; text-wrap: balance; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Fredoka', 'Trebuchet MS', sans-serif; font-size: 24px; font-weight: 600; text-decoration: none; color: var(--ink); }
    .brand img { width: 42px; height: 42px; border-radius: 11px; }
    .brand em { color: var(--leaf-text); font-style: normal; }
    .langs { display: flex; flex-wrap: wrap; gap: 6px; }
    .langs button { background: none; border: 1.5px solid var(--line); color: var(--ink2); font: 700 13px 'Nunito', sans-serif; padding: 6px 11px; border-radius: 99px; cursor: pointer; }
    .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; padding: 28px 0 40px; }
    .hero h1 { font-size: clamp(34px, 5.2vw, 56px); }
    .hero h1 em { color: var(--leaf-text); font-style: normal; background: linear-gradient(transparent 62%, var(--sun) 62%); }
    .hero p { color: var(--ink2); font-size: 18px; margin: 18px 0 28px; max-width: 36em; }
    .stores { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 16px; padding: 14px 20px; border-radius: 14px; }
    .btn.primary { background: var(--leaf); color: var(--on-leaf); }
    .btn.ghost { border: 2px solid var(--ink); color: var(--ink); }
    .btn svg { width: 20px; height: 20px; }
    .hero-shot { justify-self: center; width: min(320px, 80vw); border-radius: 28px; box-shadow: 0 24px 60px rgba(31, 58, 34, .28); }

    .facts { display: flex; flex-wrap: wrap; gap: 10px 28px; padding: 6px 0 22px; }
    .facts div { display: flex; align-items: baseline; gap: 8px; }
    .facts b { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; color: var(--leaf-text); }
    .facts span { color: var(--ink2); font-weight: 600; }

    .shots { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 0 24px; }
    .shots img { flex: 0 0 auto; width: 230px; border-radius: 20px; scroll-snap-align: start; box-shadow: 0 10px 30px rgba(31, 58, 34, .18); }

    section { padding: 36px 0; }
    section h2 { font-size: clamp(26px, 3.4vw, 36px); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 18px 20px; }

    .card span { color: var(--ink2); font-size: 15px; }
    .family { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; }
    .family li { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; }

    .note { color: var(--ink2); font-size: 15px; margin-top: 16px; max-width: 46em; }

    const SUPPORTED = Object.keys(T);
    function render(lang) {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelector('meta[name="description"]').setAttribute('content', t.description);
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
      document.getElementById('facts').replaceChildren(...t.facts.map(([n, label]) => {
        const d = document.createElement('div');
        const b = document.createElement('b'); b.textContent = n;
        const s = document.createElement('span'); s.textContent = label;
        d.append(b, s);
        return d;
      }));
      document.getElementById('features').replaceChildren(...t.features.map(([title, text]) => {
        const d = document.createElement('div'); d.className = 'card';
        const b = document.createElement('b'); b.textContent = title;
        const s = document.createElement('span'); s.textContent = text;
        d.append(b, s);
        return d;
      }));
      document.getElementById('family').replaceChildren(...t.family.map(text => {
        const li = document.createElement('li'); li.textContent = text; return li;
      }));
      document.querySelectorAll('[data-link="privacy"]').forEach(a => { a.href = '../ecokids.html?lang=' + lang; });
      document.querySelectorAll('[data-shot]').forEach(img => {
        img.src = `img/${lang}_${img.dataset.shot}.jpg`;
        img.alt = t.shots[img.dataset.shot];
      });
      document.querySelectorAll('[data-set-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)));
    }
    const asked = new URLSearchParams(location.search).get('lang');
    const nav = (navigator.language || 'en').slice(0, 2).toLowerCase();
    let lang = SUPPORTED.includes(asked) ? asked : (SUPPORTED.includes(nav) ? nav : 'en');
    document.querySelectorAll('[data-set-lang]').forEach(b => b.addEventListener('click', () => {
      lang = b.dataset.setLang; render(lang);
      history.replaceState(null, '', '?lang=' + lang);
    }));
    render(lang);
  </script>
