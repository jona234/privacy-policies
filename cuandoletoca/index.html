<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuandoLeToca · Diario del bebé</title>
  <meta name="description" content="Tomas, pañales, sueño, medicinas y crecimiento de tu bebé, todo en un mismo sitio. Compártelo con tu pareja o familia.">
  <link rel="icon" type="image/png" href="img/icon.png">
  <style>
    @font-face { font-family: 'Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/InstrumentSerif_400Regular_Italic.ttf) format('truetype'); }
    @font-face { font-family: 'Serif'; font-weight: 400; font-display: swap; src: url(fonts/InstrumentSerif_400Regular.ttf) format('truetype'); }
    @font-face { font-family: 'Jakarta'; font-weight: 400; font-display: swap; src: url(fonts/PlusJakartaSans_400Regular.ttf) format('truetype'); }
    @font-face { font-family: 'Jakarta'; font-weight: 600; font-display: swap; src: url(fonts/PlusJakartaSans_600SemiBold.ttf) format('truetype'); }
    @font-face { font-family: 'Jakarta'; font-weight: 700; font-display: swap; src: url(fonts/PlusJakartaSans_700Bold.ttf) format('truetype'); }

    :root {
      --bg: #FBF4E6; --surface: #FFFFFF; --ink: #3B2A20; --ink2: #5A4538; --line: #EADFC8;
      --terra: #C97B5C; --terra-text: #A35A3F; --on-terra: #2A1A10; --soft: #F3E2D4;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #241B15; --surface: #2E231B; --ink: #F3E7D8; --ink2: #C2AC98; --line: #42332A;
              --terra: #D98F71; --terra-text: #E0A585; --on-terra: #2A1A10; --soft: #3D2B20; }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: 'Jakarta', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.6; }
    a { color: var(--terra-text); }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
    h1, h2 { font-family: 'Serif', Georgia, serif; font-weight: 400; line-height: 1.1; text-wrap: balance; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 0; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: 'Serif', Georgia, serif; font-size: 24px; text-decoration: none; color: var(--ink); }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    .brand em { color: var(--terra-text); font-style: italic; }
    .langs button { background: none; border: 1px solid var(--line); color: var(--ink2); font: 600 13px 'Jakarta', sans-serif; padding: 6px 10px; border-radius: 99px; cursor: pointer; }
    .langs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; align-items: center; padding: 28px 0 48px; }
    .hero h1 { font-size: clamp(34px, 5.2vw, 56px); }
    .hero h1 em { color: var(--terra-text); font-style: italic; }
    .hero p { color: var(--ink2); font-size: 18px; margin: 18px 0 28px; max-width: 36em; }
    .stores { display: flex; flex-wrap: wrap; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; font-size: 16px; padding: 14px 20px; border-radius: 14px; }
    .btn.primary { background: var(--terra); color: var(--on-terra); }
    .btn.ghost { border: 1.5px solid var(--ink); color: var(--ink); }
    .btn svg { width: 20px; height: 20px; }
    .hero-shot { justify-self: center; width: min(320px, 80vw); border-radius: 28px; box-shadow: 0 24px 60px rgba(90, 40, 10, .25); }

    .shots { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 8px 0 24px; }
    .shots img { flex: 0 0 auto; width: 230px; border-radius: 20px; scroll-snap-align: start; box-shadow: 0 10px 30px rgba(90, 40, 10, .15); }

    section { padding: 36px 0; }
    section h2 { font-size: clamp(26px, 3.4vw, 36px); margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; }
    .card b { display: block; font-size: 16px; margin-bottom: 4px; }
    .card span { color: var(--ink2); font-size: 15px; }
    .card.plan b { font-family: 'Serif', Georgia, serif; font-size: 23px; font-weight: 400; }
    .tag { display: inline-block; background: var(--soft); color: var(--terra-text); font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-top: 8px; }
    .note { color: var(--ink2); font-size: 15px; margin-top: 14px; max-width: 46em; }

    footer { border-top: 1px solid var(--line); margin-top: 24px; padding: 28px 0 40px; color: var(--ink2); font-size: 14px; display: flex; flex-wrap: wrap; gap: 10px 22px; justify-content: space-between; }
    footer nav { display: flex; flex-wrap: wrap; gap: 8px 18px; }

    @media (max-width: 760px) {
      .hero { grid-template-columns: 1fr; text-align: left; padding-top: 8px; }
      .hero-shot { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="./"><img src="img/icon.png" alt="">Cuando<em>LeToca</em></a>
      <div class="langs" role="group" aria-label="Idioma / Language">
        <button type="button" data-set-lang="es">ES</button>
        <button type="button" data-set-lang="en">EN</button>
      </div>
    </header>

    <div class="hero">
      <div>
        <h1 data-i18n-html="heroTitle"></h1>
        <p data-i18n="heroText"></p>
        <div class="stores">
          <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.devlicius.cuandoletoca">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 2.5v19l10-9.5L4 2.5zm11.4 10.9-2.2 2.1 2.6 2.5 4.3-2.4c.8-.5.8-1.6 0-2.1l-2.6-1.5-2.1 1.4zM5.6 1.6l9.9 9-2.2 2.1L5.6 1.6zm0 20.8 7.7-7.1 2.2 2.1-9.9 5z"/></svg>
            <span>Google Play</span>
          </a>
          <a class="btn ghost" href="https://apps.apple.com/app/id6773707438">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.4 2-3.5 2.1-3.6-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.2 1-4 2.5-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.2.7c1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-.9-2.4-4zM14 5.4c.7-.8 1.1-1.9 1-3-1 0-2.1.6-2.8 1.4-.6.7-1.2 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z"/></svg>
            <span>App Store</span>
          </a>
        </div>
      </div>
      <img class="hero-shot" data-shot="hoy" alt="">
    </div>

    <div class="shots">
      <img data-shot="hoy" alt="">
      <img data-shot="recordatorios" alt="">
      <img data-shot="compartir" alt="">
      <img data-shot="crecimiento" alt="">
    </div>

    <section>
      <h2 data-i18n="featuresTitle"></h2>
      <div class="grid" id="features"></div>
    </section>

    <section>
      <h2 data-i18n="plansTitle"></h2>
      <div class="grid" id="plans"></div>
      <p class="note" data-i18n="plansNote"></p>
    </section>

    <section>
      <h2 data-i18n="privacyTitle"></h2>
      <p class="note" data-i18n="privacyText"></p>
    </section>

    <footer>
      <nav>
        <a data-link="privacy" data-i18n="linkPrivacy"></a>
        <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" data-i18n="linkTerms"></a>
        <a data-link="delete" data-i18n="linkDelete"></a>
        <a href="mailto:devlicius.online@gmail.com">devlicius.online@gmail.com</a>
      </nav>
      <span>© 2026 Jonatan Ortega González · <span data-i18n="country"></span></span>
    </footer>
  </div>

  <script>
    const T = {
      es: {
        title: 'CuandoLeToca · Diario del bebé',
        heroTitle: 'El <em>diario del bebé</em> sin complicarte',
        heroText: 'Tomas, pañales, sueño, medicinas, peso y talla, todo en un mismo sitio. Empiezas sin registrarte y, si quieres, lo compartes en tiempo real con tu pareja o tu familia.',
        featuresTitle: 'Todo lo que necesitas',
        features: [
          ['Tomas y pañales', 'Biberón o lactancia, con duración y cantidad, y cada cambio de pañal, en un par de toques.'],
          ['Sueño del bebé', 'Registra cuánto y cuándo duerme, con duración, para detectar sus patrones.'],
          ['Medicinas y dosis', 'Apunta qué medicina le diste y cuándo, para no perder la cuenta.'],
          ['Peso y talla', 'Con gráfica de crecimiento, lista para enseñar en la revisión del pediatra.'],
          ['Recordatorios de citas y vacunas', 'Avisan a tiempo aunque la app esté cerrada, y aparecen en la pantalla principal si quedan menos de 24h.'],
          ['Comparte el diario en pareja o familia', 'Con los planes Pareja y Familiar, todos veis y editáis el mismo diario, sincronizado al momento.'],
        ],
        plansTitle: 'Planes',
        plans: [
          ['Gratis', 'La app completa en tu móvil, con anuncios.', ''],
          ['Individual', '0,99€/mes · sin anuncios, sin compartir.', ''],
          ['Pareja', '1,99€/mes · comparte el diario con otra persona.', '2 personas'],
          ['Familiar', '3,99€/mes · comparte con el resto de la familia.', 'Hasta 5 personas'],
        ],
        plansNote: 'Mensual. Paga solo quien crea el grupo; los demás se unen gratis. Se gestiona y cancela desde Google Play o el App Store.',
        privacyTitle: 'Tus datos, bajo tu control',
        privacyText: 'Sin cuenta o con el plan Individual, todo el historial se guarda solo en tu móvil — nunca en un servidor. Con un plan Pareja o Familiar, los datos se guardan en la nube y solo los ven las personas de tu grupo. Puedes exportar el historial en PDF, CSV o JSON para el pediatra, y borrar tu cuenta y tus datos desde la propia app.',
        linkPrivacy: 'Política de privacidad', linkTerms: 'Términos de uso', linkDelete: 'Eliminar la cuenta',
        country: 'España',
      },
      en: {
        title: 'CuandoLeToca · Baby tracker',
        heroTitle: 'The <em>baby log</em> without the hassle',
        heroText: "Feedings, diapers, sleep, medicine, weight and height, all in one place. Start without signing up and, if you like, share it in real time with your partner or family.",
        featuresTitle: 'Everything you need',
        features: [
          ['Feedings and diapers', 'Bottle or breastfeeding, with duration and amount, and every diaper change, in a couple of taps.'],
          ["Baby's sleep", 'Track how long and when your baby sleeps, with duration, to spot their patterns.'],
          ['Medicine and doses', 'Note which medicine you gave and when, so you never lose track.'],
          ['Weight and height', 'With a growth chart, ready to show at the pediatrician checkup.'],
          ['Appointment and vaccine reminders', "They notify you on time even with the app closed, and show up on the home screen when less than 24h remain."],
          ['Share the log with your partner or family', 'With the Couple and Family plans, everyone sees and edits the same log, synced instantly.'],
        ],
        plansTitle: 'Plans',
        plans: [
          ['Free', 'The full app on your phone, with ads.', ''],
          ['Individual', '€0.99/month · no ads, not shared.', ''],
          ['Couple', '€1.99/month · share the log with one other person.', '2 people'],
          ['Family', '€3.99/month · share with the rest of the family.', 'Up to 5 people'],
        ],
        plansNote: 'Monthly. Only the person who creates the group pays; everyone else joins for free. Manage and cancel it in Google Play or the App Store.',
        privacyTitle: 'Your data, your control',
        privacyText: "Without an account, or with the Individual plan, your baby's history is stored only on your phone — never on a server. With a Couple or Family plan, the data is stored in the cloud and only the people in your group can see it. You can export the history as PDF, CSV or JSON for the pediatrician, and delete your account and your data from within the app.",
        linkPrivacy: 'Privacy policy', linkTerms: 'Terms of use', linkDelete: 'Delete your account',
        country: 'Spain',
      },
    };
    const BASE = '../';
    function render(lang) {
      const t = T[lang];
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n]; });
      document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t[el.dataset.i18nHtml]; });
      const card = (title, text, tag, plan) => {
        const d = document.createElement('div');
        d.className = 'card' + (plan ? ' plan' : '');
        const b = document.createElement('b'); b.textContent = title;
        const s = document.createElement('span'); s.textContent = text;
        d.append(b, s);
        if (tag) { const g = document.createElement('div'); g.className = 'tag'; g.textContent = tag; d.append(g); }
        return d;
      };
      document.getElementById('features').replaceChildren(...t.features.map(([a, b]) => card(a, b)));
      document.getElementById('plans').replaceChildren(...t.plans.map(([a, b, c]) => card(a, b, c, true)));
      // La política de privacidad y la eliminación de cuenta solo existen en
      // español (de momento) — en inglés se cae a esa misma página.
      const links = { privacy: 'cuandoletoca.html', delete: 'cuandoletoca-eliminar-cuenta.html' };
      document.querySelectorAll('[data-link]').forEach(a => { a.href = BASE + links[a.dataset.link]; });
      document.querySelectorAll('[data-shot]').forEach(img => { img.src = `img/${lang}_${img.dataset.shot}.jpg`; img.alt = t.heroTitle.replace(/<[^>]+>/g, ''); });
      document.querySelectorAll('[data-set-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setLang === lang)));
    }
    const asked = new URLSearchParams(location.search).get('lang');
    const nav = (navigator.language || 'es').slice(0, 2);
    let lang = T[asked] ? asked : (['es', 'ca', 'eu', 'gl'].includes(nav) ? 'es' : 'en');
    document.querySelectorAll('[data-set-lang]').forEach(b => b.addEventListener('click', () => {
      lang = b.dataset.setLang; render(lang);
      history.replaceState(null, '', '?lang=' + lang);
    }));
    render(lang);
  </script>
</body>
</html>
